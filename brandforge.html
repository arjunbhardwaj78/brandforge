<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrandForge — AI Brand Strategist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#F5F9F3; --plate:#FFFFFF; --ink:#20281F; --sub:#657266; --line:#DCE7D9;
  --accent:#4C9A6B; --accent2:#2F6B4A; --err:#B14A34; --glow:#E4F3E3;
  --c1:#3E7CB1; --c2:#2F8F72; --c3:#B08A2E; --c4:#B14A34; --c5:#8A5C99; --c6:#4C9A6B;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Space Grotesk',-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#141a15; --plate:#1c231d; --ink:#E7F2E5; --sub:#8fa08f; --line:#2c362b; --glow:#1c2e21; }
}
:root[data-theme="dark"]{ --paper:#141a15; --plate:#1c231d; --ink:#E7F2E5; --sub:#8fa08f; --line:#2c362b; --glow:#1c2e21; }
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);line-height:1.55;}
.topbar{padding:18px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--glow),var(--paper) 85%);}
.topbar-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
h1{font-family:var(--font-display);font-weight:600;font-size:1.5rem;margin:0;letter-spacing:-.01em;}
.sub{color:var(--sub);font-size:.86rem;margin:0;max-width:52ch;flex:1;min-width:220px;}
#autoRunBtn{margin:0;}
#autoRunBtn:disabled{background:var(--line);color:var(--sub);cursor:not-allowed;animation:none;}
.progress{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;
  font-size:.76rem;border-bottom:1px solid var(--line);}
.progress .pchip{border:1px solid var(--line);background:var(--plate);border-radius:20px;padding:4px 12px;color:var(--sub);}
.progress .pchip b{color:var(--ink);font-weight:600;}
.progress .pchip.done{border-color:var(--accent);}

.snapshot{background:linear-gradient(160deg,var(--glow),var(--plate) 60%);border:1px solid var(--line);
  border-radius:6px;padding:26px 20px;text-align:center;margin-bottom:16px;}
.snapshot .logopanel{margin:0 auto 10px;width:90px;height:90px;padding:14px;}
.snapshot h3{font-family:var(--font-display);font-size:1.6rem;margin:4px 0;}
.snapshot .tagline{font-style:italic;color:var(--sub);margin:0 0 10px;}
.snapshot .headline{font-weight:600;margin:10px auto;max-width:40ch;}
.snapshot .swatches{justify-content:center;}
.scorebadge{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);
  background:var(--plate);border-radius:20px;padding:6px 14px;margin-bottom:14px;}
.scorebadge .num{font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--accent2);}
.copybtn{background:none;border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:.7rem;
  color:var(--sub);cursor:pointer;margin-left:6px;}
@media print{
  nav,.topbar,.progress,#toastwrap,button,.editable.edited::after{display:none!important;}
  main{padding:0;} .card{border:none;animation:none;box-shadow:none;}
  body{background:#fff;color:#000;}
}
.shell{max-width:960px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0;}
@media (min-width:760px){ .shell{grid-template-columns:200px 1fr;align-items:start;} }
nav{display:flex;gap:6px;overflow-x:auto;padding:14px 20px;border-bottom:1px solid var(--line);
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
nav button{scroll-snap-align:start;}
@media (min-width:760px){
  nav{flex-direction:column;border-bottom:none;border-right:1px solid var(--line);
    padding:20px 12px;position:sticky;top:0;gap:2px;overflow:visible;scroll-snap-type:none;}
}
@media (max-width:480px){
  .card{padding:16px;}
  main{padding:14px;}
  .topbar{padding:14px 14px;}
}
nav button{flex:none;text-align:left;padding:8px 10px;border-radius:3px;border:1px solid transparent;
  background:transparent;color:var(--sub);font-family:var(--font-body);font-size:.8rem;cursor:pointer;
  white-space:nowrap;display:flex;align-items:center;gap:8px;transition:color .15s,border-color .15s;}
nav button .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;transition:background .15s;}
nav button.active{color:var(--ink);font-weight:600;border-color:var(--line);}
nav button.active .dot{background:var(--stage-color,var(--accent));}
nav button:disabled{opacity:.35;cursor:not-allowed;}
main{padding:20px;min-width:0;}
.card{background:var(--plate);border:1px solid var(--line);border-top:3px solid var(--stage-color,var(--accent));
  border-radius:2px;padding:20px;margin-bottom:14px;}
h2{font-family:var(--font-display);font-weight:600;font-size:1.15rem;margin:0 0 4px;}
p.hint{color:var(--sub);font-size:.85rem;margin:0 0 14px;max-width:62ch;}
p.hint strong{color:var(--accent2);}
textarea,input[type=text]{width:100%;padding:10px;border-radius:3px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:.9rem;}
textarea{min-height:80px;resize:vertical;}
label{font-size:.8rem;color:var(--sub);display:block;margin:12px 0 4px;}
button.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:3px;
  font-family:var(--font-body);font-weight:500;font-size:.88rem;cursor:pointer;margin-top:10px;}
button.btn.secondary{background:var(--accent2);}
button.btn:disabled{opacity:.5;cursor:wait;}
button.btn:focus-visible,.editable:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.out{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
.field{margin-bottom:10px;}
.field b{display:block;font-size:.78rem;color:var(--sub);font-weight:500;margin-bottom:2px;}
.field ul{margin:4px 0;padding-left:18px;}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.swatch{width:70px;text-align:center;font-size:.7rem;}
.swatch .chip{height:44px;border-radius:3px;border:1px solid var(--line);margin-bottom:4px;}
.logopanel{display:flex;align-items:center;justify-content:center;background:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:24px;margin:6px 0 14px;}
.logopanel svg{width:88px;height:88px;}
.err{color:var(--err);font-size:.85rem;margin-top:8px;}
.loading{font-size:.85rem;color:var(--sub);}
.editable{outline:none;border-bottom:1px dashed var(--line);padding:2px 0;cursor:text;position:relative;}
.editable:focus{border-color:var(--accent);background:rgba(76,154,107,.1);}
.editable.edited{border-bottom:1px dashed var(--accent2);}
.editable.edited::after{content:" ✎ edited by you";font-size:.68rem;color:var(--accent2);}
.editable:not(.edited):hover::before{content:"✎ click to edit";position:absolute;top:-20px;left:0;
  font-size:.65rem;color:var(--accent2);background:var(--plate);padding:2px 7px;border-radius:3px;
  border:1px solid var(--line);white-space:nowrap;z-index:5;}
.namecard{display:block;border:1px solid var(--line);border-radius:3px;padding:8px;margin-bottom:6px;cursor:pointer;}
.namecard input{margin-right:6px;}
.contrib{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.contrib .chip{border:1px solid var(--line);background:var(--paper);padding:6px 10px;border-radius:3px;font-size:.75rem;}
.contrib .chip span{display:block;color:var(--sub);font-size:.68rem;margin-bottom:1px;}
.contrib .chip b{font-family:var(--font-display);font-weight:600;}

.stamp{width:26px;height:26px;flex:none;color:var(--accent);}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;margin-right:7px;vertical-align:-2px;}
.toastwrap{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50;}
.toast{background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:3px;font-size:.82rem;
  box-shadow:0 4px 16px rgba(0,0,0,.2);}

@media (prefers-reduced-motion: no-preference){
  .topbar,.shell>nav{animation:riseIn .5s ease both;}
  .shell>nav{animation-delay:.08s;}
  .card{animation:cardIn .45s cubic-bezier(.2,.7,.3,1) both; transform-style:preserve-3d;}
  .out{animation:popIn .35s ease both;}
  .stamp{animation:breathe 4s ease-in-out infinite;}
  nav button.active .dot{animation:dotPop .3s ease both;}
  button.btn:disabled{animation:pulseSoft 1.1s ease-in-out infinite;}
  .namecard{transition:transform .18s ease,border-color .18s ease;}
  .namecard:hover{transform:perspective(400px) rotateX(3deg) translateY(-2px);border-color:var(--stage-color,var(--accent));}
  .toast{animation:toastIn .25s ease both, toastOut .3s ease 2.2s forwards;}
}
@keyframes riseIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
@keyframes cardIn{from{opacity:0;transform:perspective(700px) rotateX(-8deg) translateY(16px);}to{opacity:1;transform:perspective(700px) rotateX(0) translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.08) rotate(4deg);}}
@keyframes dotPop{from{transform:scale(.3);}to{transform:scale(1);}}
@keyframes pulseSoft{0%,100%{opacity:.5;}50%{opacity:.8;}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px);}}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <svg class="stamp" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="2.5"/>
    <path d="M12 22l5 5 11-13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>BrandForge</h1>
  <p class="sub">An adaptive AI workflow that turns a rough idea into a launch-ready brand system — with a built-in critic that checks its own work.</p>
  <button class="btn secondary" id="autoRunBtn" style="margin:0 0 0 auto;" onclick="autoRunRemaining(this)">⚡ Auto-run remaining stages</button>
</div></div>
<div id="toastwrap" class="toastwrap"></div>
<div id="progressStrip" class="progress"></div>
<div class="shell">
<nav id="nav"></nav>
<main id="main"></main>
</div>

<script>
const STAGES = ["Discover","Position","Shape","Challenge","Visualize","Deliver"];
const STAGE_COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
let cur = 0;
let sample = null;
let state = { discovery:null, followupAnswers:"", position:null, shape:null, critique:null,
  applied:false, visual:null, deliver:null, humanNotes:{}, humanEdits:new Set(), lastPrompts:{},
  introDismissed:false };
let unlocked = [true,false,false,false,false,false];

function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg){
  const wrap = document.getElementById('toastwrap');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  wrap.innerHTML = ''; wrap.appendChild(t);
  setTimeout(()=>{ if(t.parentNode) t.remove(); }, 2600);
}
function safeSvg(s){
  if(!s || typeof s !== 'string') return null;
  const trimmed = s.trim();
  if(!/^<svg[\s>]/i.test(trimmed)) return null;
  if(/<script|on\w+\s*=/i.test(trimmed)) return null;
  return trimmed;
}
function looksInsufficient(obj){
  return /cannot be determined|insufficient information|no meaningful [a-z]+ (?:exists|yet)|not applicable at this stage|^undefined$|"undefined"/i.test(JSON.stringify(obj));
}
function insufficientError(out, label){
  out.innerHTML = `<p class="err">The AI couldn't give a real answer — what you entered in Discover is too thin to build on.</p>
    <button class="btn secondary" onclick="unlocked[0]=true;cur=0;render();">← Go back to Discover and add more detail</button>`;
}

function copyText(btn, text){
  navigator.clipboard.writeText(text).then(()=>toast('Copied')).catch(()=>toast('Could not copy'));
}

function brandScore(){
  let score = 55;
  if(state.critique) score += 10;
  if(state.applied) score += 10;
  if(state.humanEdits.size>0) score += 5;
  if(state.shape && state.shape.chosen_name) score += 5;
  if(state.visual && safeSvg(state.visual.logo_svg)) score += 5;
  if(state.deliver){
    score += state.deliver.consistency_aligned ? 15 : -10;
    if(state.deliver.conflicts_found) score -= Math.min(15, state.deliver.conflicts_found.length*5);
  }
  return Math.max(35, Math.min(100, score));
}
function scoreGrade(s){ return s>=90?'A':s>=80?'A-':s>=70?'B':s>=60?'C':'D'; }

function renderSnapshot(){
  const name = state.shape && state.shape.chosen_name ? state.shape.chosen_name.name : '(unnamed)';
  const tagline = state.shape ? state.shape.tagline : '';
  const headline = state.deliver ? state.deliver.landing_headline : '';
  const logo = state.visual ? safeSvg(state.visual.logo_svg) : null;
  const colors = state.visual ? state.visual.color_mood : [];
  const score = brandScore();
  return `
  <div class="snapshot">
    ${logo?`<div class="logopanel">${logo}</div>`:''}
    <h3>${name}</h3>
    ${tagline?`<p class="tagline">"${tagline}"</p>`:''}
    ${headline?`<p class="headline">${headline}</p>`:''}
    <div class="swatches">${colors.map(c=>`<div class="swatch"><div class="chip" style="background:${c.hex}"></div>${c.name}</div>`).join('')}</div>
    <button class="copybtn" style="margin-top:10px;" onclick="copyText(this,${JSON.stringify(`${name} — ${tagline}\n\n${headline}\n\n${(state.shape&&state.shape.one_line_pitch)||''}`)})">Copy share text</button>
  </div>
  <div class="scorebadge"><span class="num">${score}</span><span>Brand Health Score — grade ${scoreGrade(score)}<br><span style="font-size:.7rem;color:var(--sub);">rewards a chosen name, applied critique fixes, your own edits, and a consistent final check</span></span></div>
  <button class="btn secondary" onclick="printBrandKit()">📄 Download as PDF</button>`;
}

async function printBrandKit(){
  if(!window.jspdf){ toast('PDF engine still loading — click again in a second.'); return; }
  const { jsPDF } = window.jspdf;
  const s = state;
  const name = s.shape && s.shape.chosen_name ? s.shape.chosen_name.name : 'Untitled Brand';
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const margin = 48, pageW = 595, pageH = 842, colW = pageW - margin*2;
  let y = 64;
  function ensure(need){ if(y > pageH-need){ doc.addPage(); y = 64; } }
  function heading(text){
    ensure(70);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(47,107,74);
    doc.text(text, margin, y); doc.setTextColor(20,20,20); y += 20;
  }
  function label(text){
    ensure(40);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(90,90,90);
    doc.text(text.replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()), margin, y);
    doc.setTextColor(20,20,20); y += 12;
  }
  function para(text){
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.splitTextToSize(String(text==null?'—':text), colW).forEach(line=>{
      ensure(40); doc.text(line, margin, y); y += 13;
    });
    y += 8;
  }
  function bullets(arr){
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    (arr||[]).forEach(item=>{
      const text = typeof item === 'object' && item ? Object.values(item).join(' — ') : String(item);
      const lines = doc.splitTextToSize('• '+text, colW-10);
      lines.forEach((line,i)=>{ ensure(40); doc.text(line, margin + (i>0?10:0), y); y += 13; });
    });
    y += 8;
  }
  function field(obj, key){ label(key); para(obj[key]); }
  function fieldList(obj, key){ label(key); bullets(obj[key]); }

  doc.setFont('times','bold'); doc.setFontSize(26); doc.text(name, margin, y); y += 28;
  if(s.shape && s.shape.tagline){
    doc.setFont('times','italic'); doc.setFontSize(12); doc.setTextColor(90,90,90);
    doc.text(s.shape.tagline, margin, y); doc.setTextColor(20,20,20); y += 26;
  }
  if(s.deliver && s.deliver.landing_headline) para(s.deliver.landing_headline);

  if(s.position){
    heading('Positioning');
    field(s.position,'category'); field(s.position,'differentiator');
    field(s.position,'value_proposition'); field(s.position,'competitive_angle');
  }
  if(s.shape){
    heading('Brand shape');
    fieldList(s.shape,'personality_traits'); fieldList(s.shape,'traits_to_avoid');
    label('chosen name'); para(s.shape.chosen_name ? `${s.shape.chosen_name.name} — ${s.shape.chosen_name.rationale}` : '—');
    field(s.shape,'one_line_pitch'); fieldList(s.shape,'voice_principles');
  }
  if(s.visual && s.visual.color_mood && s.visual.color_mood.length){
    heading('Color mood');
    ensure(90);
    s.visual.color_mood.forEach((c,i)=>{
      try{ doc.setFillColor(c.hex); }catch(e){}
      doc.rect(margin + i*95, y, 75, 26, 'F');
      doc.setFontSize(8); doc.text(`${c.name} ${c.hex}`, margin + i*95, y+38);
    });
    y += 54;
    field(s.visual,'typography'); field(s.visual,'composition_style');
    fieldList(s.visual,'symbols_motifs'); fieldList(s.visual,'concepts_to_avoid');
  }
  if(s.deliver){
    heading('Launch content');
    label('consistency check'); para(s.deliver.consistency_aligned ? 'Aligned — no conflicts found.' : 'Conflicts found:');
    if(!s.deliver.consistency_aligned) bullets(s.deliver.conflicts_found);
    field(s.deliver,'social_launch_post'); field(s.deliver,'final_notes');
  }
  if(s.blueprint){
    heading('Build blueprint (technical)');
    field(s.blueprint,'category'); fieldList(s.blueprint,'recommended_stack');
    fieldList(s.blueprint,'key_features');
    label('pseudocode');
    doc.setFont('courier','normal'); doc.setFontSize(8.5);
    String(s.blueprint.pseudocode||'').split('\n').forEach(line=>{
      doc.splitTextToSize(line||' ', colW).forEach(l=>{ ensure(40); doc.text(l, margin, y); y += 11; });
    });
  }

  const filename = `${name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-brand-kit.pdf`;
  const blob = doc.output('blob');
  try{
    const dl = await claude.use("downloads");
    if(dl){ await dl.save({filename, data: blob}); toast('PDF downloaded'); return; }
  }catch(e){ /* fall through to direct save below */ }
  try{
    doc.save(filename);
    toast('PDF downloaded');
  }catch(e){
    toast('Could not save the PDF: '+e.message);
  }
}

async function autoRunRemaining(btn){
  if(!state.discovery){ toast('Finish Discover first — describe your idea and answer the follow-ups.'); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Running all stages...'; }
  try{
    if(!state.position){
      const p1 = `You are a positioning strategist AI (stage: Position) for BrandForge. Discovery data:\n${JSON.stringify(state.discovery)}\nReturn ONLY valid JSON with keys: category (string), differentiator (string), value_proposition (one sentence), competitive_angle (string, how it beats the obvious alternative). No commentary.`;
      const j1 = await callJSON(p1, null, 'position');
      if(looksInsufficient(j1)){ toast('Discover answers are too thin — add more detail there first.'); return; }
      state.position = j1; unlocked[2] = true;
      await sleep(900);
    }
    if(!state.shape){
      const p2 = `You are a brand-personality and naming strategist AI (stage: Shape) for BrandForge. Discovery:\n${JSON.stringify(state.discovery)}\nPositioning:\n${JSON.stringify(state.position)}\nReturn ONLY valid JSON with keys: personality_traits (array of 3-5 short trait+one-line justification strings), traits_to_avoid (array of 2-3 strings), naming_directions (array of 3 objects {name, rationale}), tagline (string), one_line_pitch (string), voice_principles (array of 3 strings). No commentary.`;
      const j2 = await callJSON(p2, null, 'shape');
      if(looksInsufficient(j2)){ toast('Discover answers are too thin — add more detail there first.'); return; }
      j2.chosen_name = j2.naming_directions[0];
      state.shape = j2; unlocked[3] = true;
      await sleep(900);
    }
    if(!state.critique){
      const p3 = `You are a strict anti-generic critic AI (stage: Challenge) for BrandForge. Review this brand's positioning and shape for clichés, internal contradictions, unexamined bias, and audience mismatch.\nPositioning:\n${JSON.stringify(state.position)}\nShape:\n${JSON.stringify(state.shape)}\nReturn ONLY valid JSON with keys: cliches_detected (array of strings), contradictions (array of strings), audience_mismatch (array of strings, empty array if none), stronger_alternatives (array of strings, concrete replacement suggestions). No commentary.`;
      state.critique = await callJSON(p3, null, 'challenge_critique');
      await sleep(900);
      const p4 = `You are revising a brand based on critique. Original positioning:\n${JSON.stringify(state.position)}\nOriginal shape:\n${JSON.stringify(state.shape)}\nCritique:\n${JSON.stringify(state.critique)}\nReturn ONLY valid JSON with keys: position (object, same shape as original positioning, revised to fix the critique) and shape (object, same shape as original shape, revised to fix the critique). No commentary.`;
      const j4 = await callJSON(p4, null, 'challenge_revise');
      state.position = j4.position; state.shape = j4.shape; state.applied = true; unlocked[4] = true;
      await sleep(900);
    }
    if(!state.visual){

// Delegated edit tracking: any element with class "editable" and data-path,
// nested inside a [data-root] container, writes straight back into state
// and gets visibly flagged as human-edited when changed from the AI original.
document.addEventListener('blur', (e)=>{
  const t = e.target;
  if(!t.classList || !t.classList.contains('editable')) return;
  const rootEl = t.closest('[data-root]');
  if(!rootEl) return;
  const rootKey = rootEl.dataset.root;
  const segs = t.dataset.path.split('.');
  let ref = state[rootKey];
  for(let i=0;i<segs.length-1;i++){
    const seg = isNaN(segs[i]) ? segs[i] : +segs[i];
    ref = ref[seg];
  }
  const last = isNaN(segs[segs.length-1]) ? segs[segs.length-1] : +segs[segs.length-1];
  ref[last] = t.textContent.trim();
  const tag = rootKey+'.'+t.dataset.path;
  const changed = t.textContent.trim() !== t.dataset.orig;
  t.classList.toggle('edited', changed);
  if(changed) state.humanEdits.add(tag); else state.humanEdits.delete(tag);
}, true);

function syncHeader(){

function fieldsHTML(obj, skip=[], path=''){
  let h='';
  for(const k in obj){
    if(skip.includes(k)) continue;
    const label = k.replace(/_/g,' ');
    const v = obj[k];
    const p = path ? path+'.'+k : k;
    h += `<div class="field"><b>${label}</b>`;
    if(Array.isArray(v)){
      h += `<ul>${v.map((x,i)=> typeof x==='object'
        ? `<li>${fieldsHTML(x)}</li>`
        : `<li class="editable" contenteditable="true" data-path="${p}.${i}" data-orig="${esc(x)}">${x}</li>`
      ).join('')}</ul>`;
    } else if(typeof v === 'object' && v){
      h += fieldsHTML(v, [], p);
    } else {
      h += `<div class="editable" contenteditable="true" data-path="${p}" data-orig="${esc(v)}">${v}</div>`;
    }
    h += `</div>`;
  }
  return h;
}

async function ensureSample(){
  if(sample) return sample;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  return sample;
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function callJSON(prompt, btn, stageKey){
  const s = await ensureSample();
  if(!s){ throw new Error("AI is unavailable in this view."); }
  if(stageKey) state.lastPrompts[stageKey] = prompt;
  if(btn){ btn.disabled = true; btn.dataset.old = btn.textContent; }
  const maxTries = 3;
  try{
    for(let attempt=1; attempt<=maxTries; attempt++){
      if(btn) btn.textContent = attempt===1 ? "Thinking..." : `Retrying (busy) ${attempt-1}/${maxTries-1}...`;
      try{
        return await s.json(prompt, {modelTier:"default"});
      }catch(err){
        const rateLimited = /sampling too often|rate.?limit|try again later/i.test(err.message||'');
        if(rateLimited && attempt < maxTries){ await sleep(2500 * attempt); continue; }
        if(rateLimited) throw new Error("The AI is busy right now (rate limited) — wait about 20 seconds and click the button again.");
        throw err;
      }
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = btn.dataset.old; }
  }
}

function render(){

  </div>`;
  document.getElementById('extractBtn').onclick = async (e)=>{
    const idea = document.getElementById('ideaInput').value.trim();

    if(!idea){
      out.innerHTML = '<p class="err">Type your idea first — even one sentence is enough to start.</p>';

      return;
    }
    state._ideaRaw = idea;
    out.innerHTML = '<p class="loading">Interviewing the idea...</p>';

      const json = await callJSON(prompt, e.target, 'discover');
      state._draftDiscovery = json;
      out.innerHTML = `<div class="out">
        ${json.corrected_idea?`<div class="field"><b>Here's what we understood</b><p style="font-style:italic;">"${json.corrected_idea}"</p></div>`:''}
        ${fieldsHTML(json, ['open_questions','corrected_idea'])}

        <button class="btn secondary" id="finalizeBtn">Finalize discovery</button>
        ${promptDisclosure('discover')}</div>`;
      document.getElementById('finalizeBtn').onclick = async (ev)=>{
        const answers = json.open_questions.map((q,i)=>`Q: ${q}\nA: ${document.getElementById('fq'+i).value.trim()}`).join('\n');
        const placeholderRe = /^(idk|i ?don'?t know|dunno|n\/?a|skip|none|\?+|\.+|-+|x+)$/i;
        const tooThin = json.open_questions.some((q,i)=>{
          const v = document.getElementById('fq'+i).value.trim();

        if(tooThin){
          ev.target.insertAdjacentHTML('afterend', '<p class="err" style="margin-top:8px;">Answer each question above — even a short real answer works, just not a blank or a placeholder like "n/a".</p>');
          return;

        delete state.discovery.open_questions;
        unlocked[1] = true; cur = 1; render();

      bpOut.innerHTML = '<p class="loading">Sketching the technical plan...</p>';
      try{
        const prompt = `You are a pragmatic technical architect AI for BrandForge's optional "Build Blueprint" feature — a starting technical plan for the founder's actual product idea (not the brand). Idea/discovery data:\n${JSON.stringify(state.discovery)}\nReturn ONLY valid JSON with keys: category (string — the single best-fit category, e.g. "AI/ML", "Full-stack web app", "Mobile app", "Data/Analytics tool", "Browser extension", "Automation script"), recommended_stack (array of 4-6 short strings like "Frontend: React + Tailwind", "Backend: Node.js + Express", "Database: PostgreSQL", "AI: Claude API for X"), key_features (array of 4-6 short strings, the first features to build), pseudocode (string — 15-25 lines of clear, specific, well-commented pseudocode for this idea's core logic/flow, using \\n for line breaks, not generic boilerplate), category_icon_svg (string — a small original abstract SVG icon representing the category, viewBox="0 0 80 80", using only <svg>,<circle>,<path>,<rect>,<polygon>,<line>, no text, no script or event-handler attributes, 1-2 colors). No commentary, no markdown fences.`;
        const json = await callJSON(prompt, e.target, 'blueprint');
        state.blueprint = json;
        bpOut.innerHTML = renderBlueprint(json);
      }catch(err){ bpOut.innerHTML = `<p class="err">${err.message}</p>`; }
    };
  }
}
function renderBlueprint(json){
  const icon = safeSvg(json.category_icon_svg);
  return `<div class="out" data-root="blueprint">
    <div class="field" style="display:flex;align-items:center;gap:10px;">
      ${icon?`<div style="width:40px;height:40px;flex:none;">${icon}</div>`:''}
      <div><b>Category</b><div class="editable" contenteditable="true" data-path="category" data-orig="${esc(json.category)}">${json.category}</div></div>
    </div>
    ${fieldsHTML(json, ['category','category_icon_svg','pseudocode'])}
    <div class="field"><b>Pseudocode</b>
      <pre style="white-space:pre-wrap;font-family:monospace;font-size:.78rem;background:var(--paper);
        border:1px solid var(--line);border-radius:3px;padding:10px;">${escapeHtml(json.pseudocode)}</pre>
      <button class="copybtn" onclick="copyText(this,${JSON.stringify(json.pseudocode||'')})">Copy pseudocode</button>
    </div>
    ${promptDisclosure('blueprint')}</div>`;
}

function buildKitMarkdown(){
  const s = state;
  const notes = Object.entries(s.humanNotes).filter(([k,v])=>v&&v.trim())
    .map(([k,v])=>`- **${k}:** ${v}`).join('\n') || '_No notes added._';
  const edits = s.humanEdits.size ? Array.from(s.humanEdits).map(x=>`- ${x}`).join('\n')
    : '_No manual text edits — AI-generated wording kept as-is.._';
  const chosen = s.shape && s.shape.chosen_name ? `${s.shape.chosen_name.name} — ${s.shape.chosen_name.rationale}` : '_Not chosen yet._';
  return `# Brand Kit\n\n## Human Contribution Log\n**Name chosen by the founder (of 3 AI-proposed directions):** ${chosen}\n\n**Fields the founder manually edited:**\n${edits}\n\n**Founder's reasoning per stage:**\n${notes}\n\n## Discovery\n${JSON.stringify(s.discovery,null,2)}\n\n## Positioning\n${JSON.stringify(s.position,null,2)}\n\n## Brand Shape\n${JSON.stringify(s.shape,null,2)}\n\n## Consistency Critique Applied\n${JSON.stringify(s.critique,null,2)}\n\n## Visual Direction\n${JSON.stringify(s.visual,null,2)}\n\n## Logomark (SVG)\n\`\`\`svg\n${s.visual&&s.visual.logo_svg?s.visual.logo_svg:'Not generated.'}\n\`\`\`\n\n## Launch\n${JSON.stringify(s.deliver,null,2)}\n\n## Build Blueprint (optional, technical)\n${s.blueprint?JSON.stringify(s.blueprint,null,2):'Not generated.'}\n`;
}

function addNextButton(main, nextIdx, ready){
  if(!ready) return;
  const b = document.createElement('button');
  b.className = 'btn secondary'; b.textContent = 'Next stage →';
  b.style.marginLeft = '8px';
  b.onclick = ()=>{ unlocked[nextIdx]=true; cur=nextIdx; render(); };
  main.querySelector('.card').appendChild(b);
}

render();
</script>
</body>
</html>
